<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosetta Translate 📜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #f0f0f0;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff8c00 0%, #ffa500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #b0b0b0;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #ff8c00;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: #f0f0f0;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff8c00;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
        }

        textarea {
            min-height: 200px;
            resize: vertical;
            font-family: 'Courier New', monospace;
        }

        button {
            background: linear-gradient(135deg, #ff8c00 0%, #ffa500 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .translation-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .translation-area {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
        }

        .output-box {
            background: rgba(0, 255, 136, 0.05);
            border: 2px solid rgba(0, 255, 136, 0.2);
        }

        .status {
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 500;
            text-align: center;
        }

        .status.error {
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
        }

        .status.success {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .status.loading {
            background: rgba(255, 140, 0, 0.1);
            border: 2px solid rgba(255, 140, 0, 0.3);
            color: #ff8c00;
        }

        .hidden {
            display: none;
        }

        .info-text {
            font-size: 0.85rem;
            color: #888;
            margin-top: 6px;
            font-style: italic;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 140, 0, 0.3);
            border-radius: 50%;
            border-top-color: #ff8c00;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 140, 0, 0.2);
            border: 1px solid #ff8c00;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-left: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Rosetta Translate 📜</h1>
            <p class="subtitle">AI-Powered Translation with Your Own API Key</p>
        </header>

        <div class="card">
            <form id="translationForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="apiKey">API Key *</label>
                        <input 
                            type="password" 
                            id="apiKey" 
                            placeholder="Enter your API key"
                            required
                        >
                        <span class="info-text">Your key is never stored</span>
                    </div>

                    <div class="form-group">
                        <label for="provider">Provider *</label>
                        <select id="provider" required>
                            <option value="openrouter">OpenRouter</option>
                            <option value="openai">OpenAI</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="model">Model *</label>
                        <select id="model" required>
                            <optgroup label="OpenRouter Models">
                                <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                                <option value="anthropic/claude-3-opus">Claude 3 Opus</option>
                                <option value="anthropic/claude-3-haiku">Claude 3 Haiku</option>
                                <option value="openai/gpt-4-turbo">GPT-4 Turbo</option>
                                <option value="openai/gpt-4o">GPT-4o</option>
                                <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo</option>
                                <option value="google/gemini-pro">Gemini Pro</option>
                                <option value="meta-llama/llama-3.1-70b-instruct">Llama 3.1 70B</option>
                            </optgroup>
                            <optgroup label="OpenAI Models">
                                <option value="gpt-4-turbo-preview">GPT-4 Turbo</option>
                                <option value="gpt-4">GPT-4</option>
                                <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="sourceLang">Source Language *</label>
                        <select id="sourceLang" required>
                            <option value="English">English</option>
                            <option value="Spanish">Spanish</option>
                            <option value="French">French</option>
                            <option value="German">German</option>
                            <option value="Italian">Italian</option>
                            <option value="Portuguese">Portuguese</option>
                            <option value="Chinese">Chinese</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Korean">Korean</option>
                            <option value="Russian">Russian</option>
                            <option value="Arabic">Arabic</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="targetLang">Target Language *</label>
                        <select id="targetLang" required>
                            <option value="German">German</option>
                            <option value="English">English</option>
                            <option value="Spanish">Spanish</option>
                            <option value="French">French</option>
                            <option value="Italian">Italian</option>
                            <option value="Portuguese">Portuguese</option>
                            <option value="Chinese">Chinese</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Korean">Korean</option>
                            <option value="Russian">Russian</option>
                            <option value="Arabic">Arabic</option>
                        </select>
                    </div>
                </div>

                <div class="translation-area">
                    <div class="form-group">
                        <label for="inputText">Input Text *</label>
                        <textarea 
                            id="inputText" 
                            placeholder="Enter text to translate..."
                            required
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="outputText">Translation <span class="badge">Output</span></label>
                        <textarea 
                            id="outputText" 
                            class="output-box"
                            placeholder="Translation will appear here..."
                            readonly
                        ></textarea>
                    </div>
                </div>

                <button type="submit" id="translateBtn">
                    Translate
                </button>

                <div id="status" class="status hidden"></div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('translationForm');
        const translateBtn = document.getElementById('translateBtn');
        const status = document.getElementById('status');
        const outputText = document.getElementById('outputText');
        const providerSelect = document.getElementById('provider');
        const modelSelect = document.getElementById('model');

        // Update model options based on provider selection
        providerSelect.addEventListener('change', function() {
            const provider = this.value;
            const optgroups = modelSelect.querySelectorAll('optgroup');
            
            if (provider === 'openrouter') {
                optgroups[0].style.display = '';
                optgroups[1].style.display = 'none';
                modelSelect.value = 'anthropic/claude-3.5-sonnet';
            } else {
                optgroups[0].style.display = 'none';
                optgroups[1].style.display = '';
                modelSelect.value = 'gpt-4-turbo-preview';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Get form values
            const apiKey = document.getElementById('apiKey').value;
            const provider = document.getElementById('provider').value;
            const model = document.getElementById('model').value;
            const sourceLang = document.getElementById('sourceLang').value;
            const targetLang = document.getElementById('targetLang').value;
            const inputText = document.getElementById('inputText').value;

            // Validate
            if (!apiKey || !inputText) {
                showStatus('error', 'Please fill in all required fields');
                return;
            }

            // Show loading state
            translateBtn.disabled = true;
            outputText.value = '';
            showStatus('loading', '<span class="spinner"></span>Translating... This may take a moment.');

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: inputText,
                        apiKey,
                        provider,
                        model,
                        sourceLang,
                        targetLang,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Translation failed');
                }

                // Show success
                outputText.value = data.translation;
                showStatus('success', '✓ Translation completed successfully!');
            } catch (error) {
                showStatus('error', '✗ Error: ' + error.message);
                console.error('Translation error:', error);
            } finally {
                translateBtn.disabled = false;
            }
        });

        function showStatus(type, message) {
            status.className = 'status ' + type;
            status.innerHTML = message;
            status.classList.remove('hidden');
        }

        // Initialize provider-based model filtering
        providerSelect.dispatchEvent(new Event('change'));
    </script>
</body>
</html>
